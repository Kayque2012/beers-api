spring.application.name=beers-api

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Cache simples em memória
spring.cache.type=simple
spring.cache.cache-names=beers,beer,breweries,brewery,beersByBrewery,topBeers

# Documentação OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Observabilidade com Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Beers API
info.app.description=API de cervejas com documentação, cache e observabilidade
info.app.version=1.0.0
